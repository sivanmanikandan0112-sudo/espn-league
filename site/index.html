<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>League HQ</title>
  <meta name="theme-color" content="#0c2a20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="League HQ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
  <a class="skip" href="#main">Skip to league content</a>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a href="#/" class="brand" id="brand-link">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M6 30 L20 8 L34 30 Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><path d="M13 30 L20 19 L27 30" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/></svg>
        </span>
        <span>
          <span class="brand-kicker">League HQ</span>
          <span class="brand-name" id="league-name">Loading…</span>
        </span>
      </a>
      <a href="#/settings" data-tab="settings" class="hdr-gear" aria-label="League settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="4" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="8" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="12" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/></svg></a>
      <div class="week-badge">
        <span class="week-kicker" id="season-label"></span>
        <span class="week-big" id="week-label"></span>
        <span class="week-sub" id="teams-label"></span>
      </div>
    </div>
  </header>

  <div class="wrap">
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-tab="standings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14V8h3v6M6.5 14V3h3v11M11 14V6h3v8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        Standings</a>
      <a href="#/myteam" data-tab="myteam">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 14.5c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        My team</a>
      <a href="#/matchups" data-tab="matchups">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l4 5-4 5M13 3l-4 5 4 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        Matchups</a>
      <a href="#/insights" data-tab="insights">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13l4-5 3 3 5-7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        Insights</a>
      <a href="#/trades" data-tab="trades">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h11l-3-3M14 11H3l3 3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        Trades</a>
      <a href="#/history" data-tab="history">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v2M4 6h8l-1 8H5zM5 4h6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        History</a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="5" cy="4" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="8" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="12" r="1.6" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/></svg>
        Settings</a>
      <label class="season-pick"><span class="visually-hidden">Season</span><select id="season-select" aria-label="Season"></select></label>
    </nav>
    <div id="banner"></div>
    <main id="main" tabindex="-1"><div class="empty">Loading the league…</div></main>
  </div>

  <footer class="footer">
    <div class="wrap footer-inner" id="footer-notes"></div>
    <div class="wrap"><p class="muted" id="updated"></p></div>
  </footer>

  <nav class="bottom-nav" aria-label="Sections">
    <a href="#/" data-tab="standings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14V8h3v6M6.5 14V3h3v11M11 14V6h3v8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Standings</span></a>
    <a href="#/myteam" data-tab="myteam"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 14.5c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>My team</span></a>
    <a href="#/matchups" data-tab="matchups"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l4 5-4 5M13 3l-4 5 4 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Matchups</span></a>
    <a href="#/insights" data-tab="insights"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 13l4-5 3 3 5-7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Insights</span></a>
    <a href="#/trades" data-tab="trades"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h11l-3-3M14 11H3l3 3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Trades</span></a>
    <a href="#/history" data-tab="history"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v2M4 6h8l-1 8H5zM5 4h6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>History</span></a>
  </nav>

  <!-- cache-bust the data index so every visit gets the latest ESPN refresh -->
  <script>document.write('<script src="data/index.js?t=' + Date.now() + '"><\/script>');</script>
  <script src="config.js?v=dev"></script>
  <script src="app.js?v=dev"></script>
</body>
</html>
