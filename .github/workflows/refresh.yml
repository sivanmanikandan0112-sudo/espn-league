name: Refresh league site

# Pulls fresh data from ESPN and redeploys the site to GitHub Pages.
# Times are UTC. ET = UTC-5 (Nov-Mar) / UTC-4 (Sep-Oct).
on:
  schedule:
    - cron: "*/15 17-23 * * 0"     # Sunday afternoon games, every 15 min
    - cron: "*/15 0-4 * * 1,2,5"   # Sun / Mon / Thu night games, every 15 min
    - cron: "0 */3 * * *"          # otherwise every 3 hours (waivers, trades, lineup moves)
    - cron: "0 6-13 * * 3"         # Wednesday ~1-9 AM ET, hourly: ESPN closes the week (after Tuesday stat
                                   # corrections) and runs waivers overnight, so finished weeks land fast
  workflow_dispatch:               # "Run workflow" button for an instant refresh
    inputs:
      skip_browser_check:
        description: "Skip the browser check (only if it's wrongly blocking a good build)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The browser check runs once per version of the site's code: a fingerprint of the code files (not the data)
      # is remembered after a pass, so the 5-minute data refreshes skip it.
      - id: code
        name: Fingerprint the site's code
        run: echo "key=site-check-${{ hashFiles('site/*.js', 'site/*.css', 'site/*.html', 'site/*.webmanifest', 'check_site.mjs') }}" >> "$GITHUB_OUTPUT"

      - id: checked
        uses: actions/cache/restore@v4
        with:
          path: .site-check-ok
          key: ${{ steps.code.outputs.key }}

      - name: Pull league data from ESPN
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python3 build.py

      # If either check fails, the job stops here and the last good version stays live.
      - name: Check the data and code (every build)
        run: python3 check_site.py

      - name: Check the site in a browser (new code only)
        if: steps.checked.outputs.cache-hit != 'true' && !inputs.skip_browser_check
        # it can't install its browser library = a build-machine problem: warn and publish, check again next build
        run: |
          if ! npm install --no-save --no-fund --no-audit playwright-core@1.48.2 axe-core@4.10.2; then
            echo "::warning::Browser check skipped: couldn't install playwright-core"; exit 0
          fi
          node check_site.mjs

      # only after a real pass (check_site.mjs writes the marker)
      - if: steps.checked.outputs.cache-hit != 'true' && hashFiles('.site-check-ok') != ''
        uses: actions/cache/save@v4
        with:
          path: .site-check-ok
          key: ${{ steps.code.outputs.key }}

      - name: Stamp this deploy's version on the code files
        # index.html loads style.css/app.js with ?v=<commit>, so browsers fetch new code right away,
        # and app.js reloads itself if the data says a newer deploy is out.
        run: |
          V=${GITHUB_SHA::7}
          sed -i "s/?v=dev/?v=$V/g" site/index.html
          sed -i "s/const APP_BUILD = \"dev\";/const APP_BUILD = \"$V\";/" site/app.js
          sed -i "s/const SW_BUILD = \"dev\";/const SW_BUILD = \"$V\";/" site/sw.js
          grep -q "?v=$V" site/index.html && grep -q "APP_BUILD = \"$V\"" site/app.js && grep -q "SW_BUILD = \"$V\"" site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Two refreshes can finish close together (a push and the worker's 30-minute trigger); if GitHub is still
      # publishing the other one, wait a minute and try once more.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: sleep 75

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
