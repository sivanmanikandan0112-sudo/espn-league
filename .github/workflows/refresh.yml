name: Refresh league site

# Pulls fresh data from ESPN and redeploys the site to GitHub Pages.
# Times are UTC. ET = UTC-5 (Nov-Mar) / UTC-4 (Sep-Oct).
on:
  schedule:
    - cron: "*/15 17-23 * * 0"     # Sunday afternoon games, every 15 min
    - cron: "*/15 0-4 * * 1,2,5"   # Sun / Mon / Thu night games, every 15 min
    - cron: "0 */3 * * *"          # otherwise every 3 hours (waivers, trades, lineup moves)
    - cron: "0 6-13 * * 3"         # Wednesday ~1-9 AM ET, hourly: ESPN closes the week (after Tuesday stat
                                   # corrections) and runs waivers overnight, so finished weeks land fast
  workflow_dispatch: {}            # "Run workflow" button for an instant refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull league data from ESPN
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python3 build.py

      - name: Stamp this deploy's version on the code files
        # index.html loads style.css/app.js with ?v=<commit>, so browsers fetch new code right away,
        # and app.js reloads itself if the data says a newer deploy is out.
        run: |
          V=${GITHUB_SHA::7}
          sed -i "s/?v=dev/?v=$V/g" site/index.html
          sed -i "s/const APP_BUILD = \"dev\";/const APP_BUILD = \"$V\";/" site/app.js
          sed -i "s/const SW_BUILD = \"dev\";/const SW_BUILD = \"$V\";/" site/sw.js
          grep -q "?v=$V" site/index.html && grep -q "APP_BUILD = \"$V\"" site/app.js && grep -q "SW_BUILD = \"$V\"" site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Two refreshes can finish close together (a push and the worker's 30-minute trigger); if GitHub is still
      # publishing the other one, wait a minute and try once more.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: sleep 75

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
