name = "league-hq-live"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
LEAGUE_ID = "1262273109"
SITE_ORIGIN = "https://sivanmanikandan0112-sudo.github.io"
GITHUB_REPO = "sivanmanikandan0112-sudo/espn-league"
GITHUB_WORKFLOW = "refresh.yml"

# Every minute: the live big-play feed (during NFL games), and a check that rebuilds the full site as soon as
# rosters, lineups, trades, records or settings change on ESPN (plus every 5 min during games, every 30 min always).
# Rebuilds only run if a GITHUB_TOKEN secret is set.
[triggers]
crons = ["* * * * *"]

# Weekly pick'em: PINs and picks
[[kv_namespaces]]
binding = "PICKEM"
id = "9f2c23bf91a34b78a401c335bbc09a02"
