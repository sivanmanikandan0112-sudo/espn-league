name = "league-hq-live"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
LEAGUE_ID = "1262273109"
SITE_ORIGIN = "https://sivanmanikandan0112-sudo.github.io"
GITHUB_REPO = "sivanmanikandan0112-sudo/espn-league"
GITHUB_WORKFLOW = "refresh.yml"
SITE_DATA = "https://sivanmanikandan0112-sudo.github.io/espn-league/data/"
# Game-day alerts (Web Push) need one secret, VAPID_PRIVATE: the signing key, made and stored by set-push-key.sh.
# league member ids (as on the site) who can read the feedback inbox
ADMIN_MEMBERS = "{C852CB33-A2B0-426C-BE8C-007DA699A41A}"

# Every minute: the live big-play feed (during NFL games), and a check that rebuilds the full site as soon as
# rosters, lineups, trades, records or settings change on ESPN (plus every 5 min during games, every 30 min always).
# Rebuilds only run if a GITHUB_TOKEN secret is set.
[triggers]
# The second schedule is the same "every minute", written differently so it runs on its own: game-day alerts.
crons = ["* * * * *", "0-59 * * * *"]

# Weekly pick'em: PINs and picks
[[kv_namespaces]]
binding = "PICKEM"
id = "9f2c23bf91a34b78a401c335bbc09a02"
